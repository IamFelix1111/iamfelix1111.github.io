<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'">
    <title>Page not found</title>
    <style>
        body {
            background-color: #eee;
            margin: 50px auto auto auto;
            width: 600px;
            text-align: center;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        h1 {
            width: 800px;
            position:relative;
            left: -100px;
            letter-spacing: -1px;
            line-height: 60px;
            color: #000;
            font-size: 60px;
            font-weight: 100;
            margin: 0 0 50px 0;
            text-shadow: 0 1px 0 #fff;
        }

        h2 {
            width: 800px;
            position: relative;
            left: -100px;
            letter-spacing: -1px;
            line-height: 30px;
            color: #999;
            font-size: 30px;
            font-weight: 100;
            margin: 0 0 50px 0;
            text-shadow: 0 1px 0 #fff;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>File not found</h2>
</body>
</html>
